aid: advise-insurance
name: Advise Insurance
description: 'Advise Insurance is the Medicare distribution business of Advise Health
  Holdings, a Bloomington, Indiana company founded in 2018 by Sherman Rogers that raised
  a $100M growth round led by Oak HC/FT in March 2021. It operates as a Medicare concierge
  agency — unbiased plan comparison and enrollment help for seniors, plus managed-care
  growth support for physician practices — and its operating brand today is Bloom
  (bloomthrives.com), the Medicare telesales, quoting, enrollment and health-activation
  business Rogers launched in 2007. Bloom sells the Ascend platform (Ascend Quote &
  Enroll, Ascend Broker, Health Activations) to national and regional health plans on a
  white-label basis. As of 2026-09-09 the company publishes no developer portal, no API
  documentation and no machine-readable API contract; adviseinsurance.com no longer
  serves a site of its own and resolves into the bloomthrives.com WordPress multisite.'
